services:
  - type: web
    name: personal-planning-agent-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: APP_INTERNAL_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
