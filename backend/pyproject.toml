[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-planning-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai>=2,<3", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
planning-agent = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
